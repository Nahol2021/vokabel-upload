<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vokabeln">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Vokabel-Scanner Upload</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f3f0; color: #1a1a1a;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #17181a; color: #f0f0f0; }
    .card { background: #232527 !important; border-color: #34363a !important; }
    input[type="password"] { background: #17181a !important; color: #f0f0f0 !important; border-color: #34363a !important; }
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; text-align: center; }
  p.sub { color: #8a8a8a; text-align: center; margin: 0 0 24px; font-size: 0.9rem; }
  .card {
    width: 100%; max-width: 420px;
    background: #fff; border: 1px solid #e4e2dd; border-radius: 16px;
    padding: 20px; margin-bottom: 16px;
  }
  .card h2 { font-size: 0.95rem; margin: 0 0 12px; }
  input[type="password"] {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid #d8d6d0; font-size: 1rem; margin-bottom: 10px;
  }
  button {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    font-size: 1rem; font-weight: 600; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-primary { background: #c0392b; color: #fff; }
  .btn-secondary { background: #eceae5; color: #1a1a1a; }
  @media (prefers-color-scheme: dark) { .btn-secondary { background: #34363a; color: #f0f0f0; } }
  .btn-primary:disabled { opacity: 0.5; }
  #captureLabel, #libraryLabel {
    display: block; text-align: center; padding: 24px 20px; border-radius: 16px;
    border: 2px dashed #c0392b33; background: #c0392b0d; color: #c0392b;
    font-weight: 600; margin-bottom: 10px;
  }
  #libraryLabel { padding: 16px 20px; }
  #thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .thumb { position: relative; width: 78px; height: 78px; border-radius: 10px; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb button {
    position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; padding: 0;
    border-radius: 50%; background: rgba(0,0,0,.65); color: #fff; font-size: 14px;
    line-height: 22px; border: none;
  }
  .feldlabel { display: block; font-size: .85rem; color: #8a8a8a; margin-bottom: 6px; }
  textarea {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #d8d6d0;
    font-size: 1rem; font-family: inherit; margin-bottom: 14px; resize: vertical;
  }
  @media (prefers-color-scheme: dark) {
    textarea { background: #17181a; color: #f0f0f0; border-color: #34363a; }
  }
  #status { text-align: center; font-size: 0.9rem; margin-top: 8px; min-height: 1.2em; white-space: pre-line; }
  .status-ok { color: #1a7d3a; }
  .status-err { color: #c0392b; }
  a.issues-link {
    display: block; text-align: center; margin-top: 14px; color: #c0392b;
    font-weight: 600; text-decoration: none; font-size: 0.95rem;
  }
  #tokenSection.hidden, #uploadSection.hidden { display: none; }
</style>
</head>
<body>
  <h1>Vokabel-Scanner</h1>
  <p class="sub">Beliebig viele Bilder sammeln → Abschicken → eine Lektion in Navigium</p>

  <div class="card" id="tokenSection">
    <h2>Einmalig: GitHub-Zugriff einrichten</h2>
    <input type="password" id="tokenInput" placeholder="GitHub Token (ghp_... / github_pat_...)" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="btn-primary" onclick="saveToken()">Speichern (nur auf diesem iPad)</button>
    <div id="tokenStatus" style="text-align:center; font-size:0.85rem; margin-top:8px; color:#8a8a8a;">
      Der Token wird nur lokal in Safari gespeichert, nie irgendwo anders hin gesendet.
    </div>
  </div>

  <div class="card" id="uploadSection">
    <h2>Neue Lektion</h2>

    <label id="captureLabel" for="cameraInput">📷 Foto aufnehmen</label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" multiple style="display:none" onchange="addFiles(event)">

    <label id="libraryLabel" for="libraryInput">🖼️ Aus Fotos / Screenshots wählen</label>
    <input type="file" id="libraryInput" accept="image/*" multiple style="display:none" onchange="addFiles(event)">

    <div id="thumbs"></div>

    <label class="feldlabel" for="notiz">Hinweise (optional)</label>
    <textarea id="notiz" rows="3" placeholder="z.B. „Die Lektion beginnt bei amiga und geht bis agua“ oder „Seite 2 gehört zur selben Lektion“"></textarea>

    <button class="btn-primary" id="submitBtn" onclick="submitBatch()" disabled>Abschicken</button>
    <div id="status"></div>
    <button class="btn-secondary" style="margin-top:14px" onclick="resetToken()">Token zurücksetzen</button>
  </div>

<script>
  const REPO = "Nahol2021/vokabel-scanner";
  const TOKEN_KEY = "vokabel_scanner_gh_token";

  function $(id) { return document.getElementById(id); }

  function refreshSections() {
    const token = localStorage.getItem(TOKEN_KEY);
    $("tokenSection").classList.toggle("hidden", !!token);
    $("uploadSection").classList.toggle("hidden", !token);
  }

  function saveToken() {
    const val = $("tokenInput").value.trim();
    if (!val) return;
    localStorage.setItem(TOKEN_KEY, val);
    $("tokenInput").value = "";
    refreshSections();
  }

  function resetToken() {
    localStorage.removeItem(TOKEN_KEY);
    refreshSections();
  }

  function setStatus(text, cls) {
    const el = $("status");
    el.textContent = text;
    el.className = cls || "";
  }

  function extFromMime(mime) {
    if (mime === "image/png") return "png";
    if (mime === "image/heic" || mime === "image/heif") return "heic";
    return "jpg";
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  let gesammelt = [];

  function renderThumbs() {
    const box = $("thumbs");
    box.innerHTML = "";
    gesammelt.forEach((eintrag, i) => {
      const div = document.createElement("div");
      div.className = "thumb";
      const img = document.createElement("img");
      img.src = eintrag.url;
      const del = document.createElement("button");
      del.textContent = "×";
      del.onclick = () => { URL.revokeObjectURL(eintrag.url); gesammelt.splice(i, 1); renderThumbs(); };
      div.append(img, del);
      box.append(div);
    });
    $("submitBtn").disabled = gesammelt.length === 0;
    $("submitBtn").textContent = gesammelt.length
      ? `Abschicken (${gesammelt.length} ${gesammelt.length === 1 ? "Bild" : "Bilder"})`
      : "Abschicken";
  }

  function addFiles(event) {
    for (const file of event.target.files) {
      gesammelt.push({ file, url: URL.createObjectURL(file) });
    }
    event.target.value = "";
    setStatus("");
    renderThumbs();
  }

  async function ghPut(token, pfad, base64, nachricht) {
    return fetch(`https://api.github.com/repos/${REPO}/contents/${pfad}`, {
      method: "PUT",
      headers: {
        "Authorization": `Bearer ${token}`,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ message: nachricht, content: base64 }),
    });
  }

  async function submitBatch() {
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) { refreshSections(); return; }
    if (!gesammelt.length) return;

    $("submitBtn").disabled = true;
    const stapel = String(Date.now());
    const bilder = [];

    try {
      for (let i = 0; i < gesammelt.length; i++) {
        setStatus(`Lade Bild ${i + 1} von ${gesammelt.length} hoch ...`);
        const { file } = gesammelt[i];
        const name = `${i + 1}.${extFromMime(file.type)}`;
        const res = await ghPut(token, `inbox/${stapel}/${name}`, await fileToBase64(file),
                                `Vokabelbild ${i + 1} (Stapel ${stapel})`);
        if (res.status === 401) {
          setStatus("Token ungültig oder abgelaufen. Bitte zurücksetzen und neu eintragen.", "status-err");
          $("submitBtn").disabled = false;
          return;
        }
        if (res.status !== 201) {
          setStatus(`Fehler bei Bild ${i + 1} (${res.status}): ${(await res.text()).slice(0, 160)}`, "status-err");
          $("submitBtn").disabled = false;
          return;
        }
        bilder.push(name);
      }

      // Die Marker-Datei loest erst jetzt die Verarbeitung aus - so wird aus
      // allen Bildern zusammen genau eine Lektion.
      setStatus("Starte Verarbeitung ...");
      const marker = { bilder, notiz: $("notiz").value.trim(), erstellt: new Date().toISOString() };
      const res = await ghPut(token, `inbox/${stapel}/batch.json`,
                              btoa(unescape(encodeURIComponent(JSON.stringify(marker, null, 2)))),
                              `Stapel ${stapel} abschicken (${bilder.length} Bilder)`);
      if (res.status !== 201) {
        setStatus(`Fehler beim Abschicken (${res.status})`, "status-err");
        $("submitBtn").disabled = false;
        return;
      }

      gesammelt.forEach((e) => URL.revokeObjectURL(e.url));
      gesammelt = [];
      $("notiz").value = "";
      renderThumbs();
      setStatus(`Abgeschickt! ${bilder.length} ${bilder.length === 1 ? "Bild wird" : "Bilder werden"} zu einer Lektion verarbeitet und in Navigium angelegt (~1 Min.).`, "status-ok");
    } catch (e) {
      setStatus("Netzwerkfehler: " + e.message, "status-err");
      $("submitBtn").disabled = false;
    }
  }

  refreshSections();
  renderThumbs();

  }
</script>
</body>
</html>
